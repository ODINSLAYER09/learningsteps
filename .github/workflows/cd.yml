name: LearningSteps CD

on:
  workflow_run:
    workflows: ["LearningSteps CI"] # MUST match the exact 'name:' inside ci.yml
    types:
      - completed
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v1
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Prepare deployment manifest (inject ACR and tag)
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ACR_SERVER="${ACR_NAME}.azurecr.io"
          mkdir -p .github/workflow-rendered
          sed -e "s|<acr-server>|${ACR_SERVER}|g" -e "s|<acr_tag>|${IMAGE_TAG}|g" k8s-manifests/deployment.yaml > .github/workflow-rendered/deployment.yaml
          echo "Rendered deployment written to .github/workflow-rendered/deployment.yaml"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s-manifests/configmap.yaml || true
          kubectl apply -f k8s-manifests/secret.yaml || true
          kubectl apply -f .github/workflow-rendered/deployment.yaml
          kubectl apply -f k8s-manifests/service.yaml
          kubectl apply -f k8s-manifests/hpa.yaml || true

      - name: Restart deployment to pick up new image
        run: |
          kubectl rollout restart deployment/learningsteps || true

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/learningsteps --timeout=2m || true
