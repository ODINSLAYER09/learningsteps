# GitHub Actions workflow for LearningSteps project
# Name: Learningsteps CI
# Triggers: push to `main`, pull_request events, and manual dispatch
name: "Learningsteps CI"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "api/**"
      - "k8s-manifests/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "api/**"
      - "k8s-manifests/**"
  workflow_dispatch:

# Single job that runs on Ubuntu to: checkout code, setup Python, run lint/tests, and build the image
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      ACR_SERVER: ${{ secrets.ACR_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR__PASSWORD: ${{ secrets.ACR__PASSWORD }}

    steps:
      # Checkout the repository to the runner workspace so subsequent steps can access the code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install Python 3.13 on the runner so we can install dependencies and run tests
      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Install dependencies from the API requirements file. This ensures the test/runtime deps are available.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      # Run ruff linter. This step is non-blocking (won't fail the job) but will surface issues as a warning.
      - name: Lint with ruff (non-blocking)
        continue-on-error: true
        run: |
          # Install ruff (if not included in requirements) and run checks on the API package
          python -m pip install --upgrade ruff || true
          ruff check api || true

      # Run the test suite using pytest. This is the gate that must pass for CI to succeed.
      - name: Run tests (pytest)
        run: |
          python -m pip install --upgrade pytest
          pytest -q

      # Build a Docker image and tag it with the commit SHA for traceability.
      - name: Build Docker image (tagged with commit SHA)
        run: |
          IMAGE_REF="${{ secrets.ACR_SERVER }}/learningsteps-app:${{ github.sha }}"
          docker build -t "$IMAGE_REF" .

      # Scan the built image with Trivy v0.36.0 before pushing to ACR.
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.ACR_SERVER }}/learningsteps-app:${{ github.sha }}
          scan-type: image
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Login to Azure Container Registry using environment variables from GitHub.
      - name: Login to Azure Container Registry
        run: |
          echo "${{ env.ACR__PASSWORD }}" | docker login ${{ env.ACR_SERVER }} -u "${{ env.ACR_USERNAME }}" --password-stdin
        env:
          ACR__PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_SERVER: ${{ secrets.ACR_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}

      # Push the scanned image to Azure Container Registry.
      - name: Push Docker image to ACR
        run: |
          IMAGE_REF="${{ env.ACR_SERVER }}/learningsteps-app:${{ github.sha }}"
          docker push "$IMAGE_REF"
        env:
          ACR_SERVER: ${{ secrets.ACR_SERVER }}

  secrets_scan:
    name: Secrets scan
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository with full git history so Gitleaks can scan every commit.
      - name: Checkout repository with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Run Gitleaks on the full repository history to detect secrets in code or git history.
      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v2
        with:
          args: --source . --verbose
          config: ''
