version: '3.8'

services:
  database:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_volume:/var/lib/postgresql/data
      - ./database/setup.sql:/docker-entrypoint-initdb.d/database_setup.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: app_service
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    # Use the image's default CMD (uvicorn main:app...) from the Dockerfile

volumes:
  db_volume:
